title: '[Замечание] '
body:
  - type: textarea
    id: feedback
    attributes:
      label: Замечание или впечатление
      description: Что удобно, непонятно или мешает? Укажите версию мода, режим поиска и состояние окна игры.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Пример или снимок
      description: Для ошибки звукового уведомления или установщика заполните форму ошибки в Issues.
